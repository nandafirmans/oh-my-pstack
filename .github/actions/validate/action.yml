name: Validate pstack
description: Shared skill, updater, and integration verification.
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Verify skills and updater scenarios
      shell: bash
      run: |
        npm run verify
        npm run test:sync
        git diff --check

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2

    - name: Test bundled watcher and planning scripts
      shell: bash
      working-directory: skills/poteto-mode/scripts
      run: |
        bun install --frozen-lockfile --ignore-scripts
        bun run test
        bun run typecheck
        bash -n worktree-audit.sh

    - name: Set up Java for statechart integration tests
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Fetch checksum-pinned TLC
      shell: bash
      run: |
        curl --fail --location --output "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
        printf '%s  %s\n' '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88' "$RUNNER_TEMP/tla2tools.jar" | sha256sum --check
        echo "TLA2TOOLS=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"

    - name: Test statechart integration
      shell: bash
      working-directory: skills/statechart/scripts
      run: |
        npm install --ignore-scripts --no-audit --no-fund --package-lock=false
        ../../poteto-mode/scripts/node_modules/.bin/tsc --project tsconfig.json --typeRoots ../../poteto-mode/scripts/node_modules/@types
        npm test
