name: Sync upstream pstack

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-pstack-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out package
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect upstream changes
        id: upstream
        shell: bash
        run: |
          set +e
          node scripts/sync-upstream.mjs --check
          status=$?
          set -e
          case "$status" in
            0) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            10) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Apply safe upstream update
        id: sync
        if: steps.upstream.outputs.changed == 'true'
        run: node scripts/sync-upstream.mjs --apply

      - name: Prepare protected reconciliation proposals
        if: failure() && steps.sync.outcome == 'failure'
        run: node scripts/sync-upstream.mjs --prepare-review "$RUNNER_TEMP/pstack-review"

      - name: Retain blocked reconciliation for review
        if: always() && steps.sync.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pstack-protected-review
          path: ${{ runner.temp }}/pstack-review
          if-no-files-found: warn

      - name: Validate synchronized package
        if: steps.upstream.outputs.changed == 'true'
        uses: ./.github/actions/validate

      - name: Open update pull request
        if: steps.upstream.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: sync upstream pstack"
          title: "chore: sync upstream pstack"
          body: |
            Automated update from the authoritative pstack source pinned in upstream.lock.json.

            Managed files passed package, updater, watcher, planning, type, and statechart checks.
            Protected OMP adaptations are never overwritten automatically. A changed protected
            path or local adaptation blocks this job; reconciliation proposals are retained
            as an artifact for explicit review, not treated as approvals.
          branch: automation/upstream-pstack
          add-paths: |
            skills
            upstream.lock.json
          delete-branch: true
