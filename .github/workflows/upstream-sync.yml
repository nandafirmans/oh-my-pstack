name: Sync upstream pstack

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-pstack-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out package
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect upstream changes
        id: upstream
        shell: bash
        run: |
          set +e
          node scripts/sync-upstream.mjs --check
          status=$?
          set -e
          case "$status" in
            0) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            10) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Apply safe upstream update
        id: sync
        if: steps.upstream.outputs.changed == 'true'
        run: node scripts/sync-upstream.mjs --apply

      - name: Prepare protected reconciliation proposals
        if: failure() && steps.sync.outcome == 'failure'
        run: node scripts/sync-upstream.mjs --prepare-review "$RUNNER_TEMP/pstack-review"

      - name: Retain blocked reconciliation for review
        if: always() && steps.sync.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pstack-protected-review
          path: ${{ runner.temp }}/pstack-review
          if-no-files-found: warn

      - name: Verify package and updater
        if: steps.upstream.outputs.changed == 'true'
        run: |
          npm run verify
          npm run test:sync
          git diff --check

      - name: Set up Bun
        if: steps.upstream.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Test bundled watcher and planning scripts
        if: steps.upstream.outputs.changed == 'true'
        working-directory: skills/poteto-mode/scripts
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run test
          bun run typecheck
          bash -n worktree-audit.sh

      - name: Set up Java for statechart integration tests
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fetch checksum-pinned TLC
        if: steps.upstream.outputs.changed == 'true'
        run: |
          curl --fail --location --output "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          printf '%s  %s\n' '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88' "$RUNNER_TEMP/tla2tools.jar" | sha256sum --check
          echo "TLA2TOOLS=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"

      - name: Test statechart integration
        if: steps.upstream.outputs.changed == 'true'
        working-directory: skills/statechart/scripts
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          ../../poteto-mode/scripts/node_modules/.bin/tsc --project tsconfig.json --typeRoots ../../poteto-mode/scripts/node_modules/@types
          npm test

      - name: Open update pull request
        if: steps.upstream.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: sync upstream pstack"
          title: "chore: sync upstream pstack"
          body: |
            Automated update from the authoritative pstack source pinned in upstream.lock.json.

            Managed files passed package, updater, watcher, planning, type, and statechart checks.
            Protected OMP adaptations are never overwritten automatically. A changed protected
            path or local adaptation blocks this job; reconciliation proposals are retained
            as an artifact for explicit review, not treated as approvals.
          branch: automation/upstream-pstack
          add-paths: |
            skills
            upstream.lock.json
          delete-branch: true
